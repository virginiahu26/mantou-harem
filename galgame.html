<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>馒头的后宫 - 恋爱模拟器好感度排行榜</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        sakura: {
                            50: '#fff5f7',
                            100: '#ffe3ec',
                            200: '#ffcce0',
                            300: '#ffa8cb',
                            400: '#ff71a5',
                            500: '#f83b82',
                            600: '#e31b63',
                            700: '#be0f4a',
                        },
                        dream: {
                            purple: '#9d4edd',
                            dark: '#2b1055',
                            card: 'rgba(255, 255, 255, 0.75)'
                        }
                    },
                    fontFamily: {
                        sans: ['PingFang SC', 'Microsoft YaHei', 'sans-serif']
                    }
                }
            }
        }
    </script>
    <style>
        body {
            background: linear-gradient(135deg, #fce4ec 0%, #f3e5f5 50%, #e8eaf6 100%);
            min-height: 100vh;
            overflow-x: hidden;
            user-select: none;
        }

        /* 玻璃拟态效果 */
        .glass-card {
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.6);
            box-shadow: 0 8px 32px 0 rgba(233, 30, 99, 0.1);
        }

        .glass-card-gold {
            background: linear-gradient(135deg, rgba(255, 253, 231, 0.9), rgba(255, 236, 179, 0.8));
            backdrop-filter: blur(12px);
            border: 2px solid rgba(255, 215, 0, 0.7);
            box-shadow: 0 10px 35px 0 rgba(255, 193, 7, 0.25);
        }

        /* 背景爱心动画 */
        .floating-heart-bg {
            position: fixed;
            pointer-events: none;
            z-index: 0;
            animation: floatUp 8s linear infinite;
            opacity: 0.4;
        }

        @keyframes floatUp {
            0% {
                transform: translateY(100vh) scale(0.5) rotate(0deg);
                opacity: 0.6;
            }
            100% {
                transform: translateY(-10vh) scale(1.2) rotate(360deg);
                opacity: 0;
            }
        }

        /* 漂浮加分/爱心动画 */
        .heart-pop {
            position: fixed;
            pointer-events: none;
            z-index: 9999;
            font-weight: bold;
            animation: popAndFade 1.2s ease-out forwards;
        }

        @keyframes popAndFade {
            0% {
                transform: translate(-50%, -50%) scale(0.6);
                opacity: 1;
            }
            50% {
                transform: translate(-50%, -100%) scale(1.3);
                opacity: 0.9;
            }
            100% {
                transform: translate(-50%, -150%) scale(1);
                opacity: 0;
            }
        }

        /* 呼吸光效 */
        .glow-effect {
            animation: glow 2.5s infinite alternate;
        }

        @keyframes glow {
            from {
                box-shadow: 0 0 10px rgba(248, 59, 130, 0.3), 0 0 20px rgba(248, 59, 130, 0.2);
            }
            to {
                box-shadow: 0 0 20px rgba(248, 59, 130, 0.6), 0 0 30px rgba(248, 59, 130, 0.4);
            }
        }

        /* 隐藏滚动条但保留功能 */
        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
    </style>
</head>
<body class="text-gray-800 relative pb-16">

    <!-- 动态背景爱心容器 -->
    <div id="heartBgContainer"></div>

    <header class="sticky top-0 z-40 backdrop-blur-md bg-white/50 border-b border-pink-100/80 px-4 py-3 shadow-sm">
        <div class="max-w-6xl mx-auto flex flex-wrap justify-between items-center gap-3">
            <div class="flex items-center space-x-3">
                <div class="w-10 h-10 rounded-full bg-gradient-to-tr from-pink-400 to-rose-500 flex items-center justify-center text-white text-xl shadow-md">
                    <i class="fa-solid font-bold fa-crown"></i>
                </div>
                <div>
                    <h1 class="text-2xl font-black bg-gradient-to-r from-pink-600 via-rose-500 to-purple-600 bg-clip-text text-transparent">
                        馒头的后宫
                    </h1>
                    <p class="text-xs text-pink-500 font-medium">恋爱模拟器 · 好感度排行榜</p>
                </div>
            </div>

            <!-- 顶部快捷操作栏 -->
            <div class="flex flex-wrap items-center gap-2">
                <button onclick="openAddModal()" class="bg-gradient-to-r from-pink-500 to-rose-500 hover:from-pink-600 hover:to-rose-600 text-white font-bold px-4 py-2 rounded-full shadow-lg hover:shadow-pink-300/50 transition-all transform hover:-translate-y-0.5 flex items-center gap-1.5 text-sm">
                    <i class="fa-solid fa-heart-circle-plus"></i>
                    <span>纳妃/纳妾</span>
                </button>
                <button onclick="triggerRandomInteration()" class="bg-purple-500 hover:bg-purple-600 text-white font-bold px-3.5 py-2 rounded-full shadow hover:shadow-purple-200 transition-all text-sm flex items-center gap-1.5">
                    <i class="fa-solid fa-wand-magic-sparkles"></i>
                    <span>翻牌子</span>
                </button>
                <button onclick="toggleLogModal()" class="bg-white/80 hover:bg-white text-pink-600 border border-pink-200 font-semibold px-3 py-2 rounded-full transition-all text-sm flex items-center gap-1">
                    <i class="fa-solid fa-book-heart"></i>
                    <span>起居注</span>
                </button>
                <div class="relative inline-block text-left" id="moreMenuContainer">
                    <button onclick="toggleMoreMenu()" class="bg-white/80 hover:bg-white text-gray-600 border border-gray-200 w-9 h-9 rounded-full flex items-center justify-center transition-all">
                        <i class="fa-solid fa-ellipsis-vertical"></i>
                    </button>
                    <!-- 下拉菜单 -->
                    <div id="moreMenu" class="hidden absolute right-0 mt-2 w-48 bg-white/95 rounded-2xl shadow-xl border border-pink-100 z-50 py-2 text-sm">
                        <button onclick="exportData()" class="w-full text-left px-4 py-2 text-gray-700 hover:bg-pink-50 flex items-center gap-2">
                            <i class="fa-solid fa-download text-pink-400"></i> 导出 JSON 数据
                        </button>
                        <button onclick="triggerImport()" class="w-full text-left px-4 py-2 text-gray-700 hover:bg-pink-50 flex items-center gap-2">
                            <i class="fa-solid fa-upload text-pink-400"></i> 导入 JSON 数据
                        </button>
                        <input type="file" id="importFileInput" class="hidden" accept=".json" onchange="importData(event)">
                        <div class="border-t border-gray-100 my-1"></div>
                        <button onclick="resetDefaultData()" class="w-full text-left px-4 py-2 text-rose-600 hover:bg-rose-50 flex items-center gap-2">
                            <i class="fa-solid fa-rotate-left"></i> 重置默认样例
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </header>

    <!-- 主界面内容区 -->
    <main class="max-w-6xl mx-auto px-4 py-6 space-y-8 relative z-10">

        <section id="empressSection" class="w-full">
            <!-- 动态生成正宫展示卡片 -->
        </section>

        <div class="flex flex-col sm:flex-row justify-between items-center gap-4 bg-white/40 p-3 rounded-2xl border border-white/60 shadow-sm backdrop-blur-sm">
            <div class="flex items-center gap-2">
                <span class="text-lg font-bold text-gray-700 flex items-center gap-1">
                    <i class="fa-solid fa-ranking-star text-pink-500"></i> 后宫美眷榜
                </span>
                <span id="totalCountBadge" class="bg-pink-100 text-pink-600 text-xs px-2.5 py-0.5 rounded-full font-bold">
                    共 0 位
                </span>
            </div>
            
            <div class="flex flex-wrap items-center gap-2 w-full sm:w-auto">
                <!-- 搜索框 -->
                <div class="relative flex-1 sm:w-48">
                    <i class="fa-solid fa-magnifying-glass absolute left-3 top-1/2 -translate-y-1/2 text-pink-300 text-sm"></i>
                    <input type="text" id="searchInput" oninput="renderApp()" placeholder="搜索爱妃名/标签..." class="w-full pl-9 pr-3 py-1.5 text-sm rounded-full border border-pink-200 focus:outline-none focus:ring-2 focus:ring-pink-400/50 bg-white/80">
                </div>
                <!-- 排序选项 -->
                <select id="sortBy" onchange="renderApp()" class="px-3 py-1.5 text-sm rounded-full border border-pink-200 bg-white/80 text-gray-700 focus:outline-none focus:ring-2 focus:ring-pink-400/50 font-medium">
                    <option value="favor-desc">好感度高 → 低</option>
                    <option value="favor-asc">好感度低 → 高</option>
                    <option value="name">名字排序</option>
                    <option value="updated">最新变动</option>
                </select>
            </div>
        </div>

        <section id="characterGrid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
            <!-- 卡片列表由 JS 渲染 -->
        </section>

    </main>

    <div id="characterModal" class="fixed inset-0 bg-black/40 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
        <div class="bg-white/95 rounded-3xl max-w-lg w-full p-6 shadow-2xl border border-pink-100 relative max-h-[90vh] overflow-y-auto no-scrollbar">
            <button onclick="closeModal()" class="absolute top-4 right-4 text-gray-400 hover:text-gray-600 w-8 h-8 rounded-full flex items-center justify-center bg-gray-100">
                <i class="fa-solid fa-xmark"></i>
            </button>
            <h2 id="modalTitle" class="text-xl font-bold text-pink-600 mb-4 flex items-center gap-2">
                <i class="fa-solid fa-heart"></i> 纳为佳丽
            </h2>

            <form id="characterForm" onsubmit="handleFormSubmit(event)" class="space-y-4">
                <input type="hidden" id="charId">

                <div>
                    <label class="block text-xs font-bold text-gray-600 mb-1">姓名 / 称呼 *</label>
                    <input type="text" id="charName" required placeholder="如：林月如、学姐、小桃..." class="w-full px-3.5 py-2 rounded-xl border border-pink-200 focus:outline-none focus:ring-2 focus:ring-pink-400">
                </div>

                <div>
                    <label class="block text-xs font-bold text-gray-600 mb-1">选择或上传头像</label>
                    <!-- 内置预设头像 -->
                    <div class="flex items-center gap-2 mb-2 overflow-x-auto py-1 no-scrollbar" id="presetAvatars">
                        <!-- 动态渲染或写死常用 preset -->
                    </div>
                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-2">
                        <input type="url" id="charAvatarUrl" placeholder="图片 URL 链接..." class="px-3 py-1.5 text-sm rounded-xl border border-pink-200 focus:outline-none focus:ring-2 focus:ring-pink-400">
                        <label class="cursor-pointer bg-pink-50 hover:bg-pink-100 text-pink-600 border border-pink-200 rounded-xl px-3 py-1.5 text-sm flex items-center justify-center gap-1.5 font-medium transition-colors">
                            <i class="fa-solid fa-upload"></i> 本地图片上传
                            <input type="file" accept="image/*" class="hidden" onchange="handleFileUpload(event)">
                        </label>
                    </div>
                    <div class="mt-2 flex items-center gap-3">
                        <span class="text-xs text-gray-400">当前预览：</span>
                        <img id="avatarPreview" src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?auto=format&fit=crop&w=150&q=80" class="w-10 h-10 rounded-full object-cover border-2 border-pink-300">
                    </div>
                </div>

                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="block text-xs font-bold text-gray-600 mb-1">初始好感度 (0 - 999)</label>
                        <input type="number" id="charFavor" min="0" max="999" value="50" required class="w-full px-3 py-2 rounded-xl border border-pink-200 focus:outline-none focus:ring-2 focus:ring-pink-400">
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-gray-600 mb-1">主题卡片色系</label>
                        <select id="charColor" class="w-full px-3 py-2 rounded-xl border border-pink-200 focus:outline-none focus:ring-2 focus:ring-pink-400 bg-white">
                            <option value="pink">浪漫粉红</option>
                            <option value="purple">梦幻紫</option>
                            <option value="blue">清澈蓝</option>
                            <option value="amber">元气橙</option>
                            <option value="emerald">清新绿</option>
                        </select>
                    </div>
                </div>

                <div>
                    <label class="block text-xs font-bold text-gray-600 mb-1">自定义身份/人设标签 (多个用逗号隔开)</label>
                    <input type="text" id="charTags" placeholder="例如：傲娇, 青梅竹马, 学姐" class="w-full px-3 py-2 rounded-xl border border-pink-200 focus:outline-none focus:ring-2 focus:ring-pink-400">
                </div>

                <div>
                    <label class="block text-xs font-bold text-gray-600 mb-1">经典名言 / 口头禅 / 备注</label>
                    <textarea id="charQuote" rows="2" placeholder="例如：才、才不是专门给你准备的奶茶呢！" class="w-full px-3 py-2 rounded-xl border border-pink-200 focus:outline-none focus:ring-2 focus:ring-pink-400 text-sm"></textarea>
                </div>

                <div class="pt-2 flex justify-end gap-2">
                    <button type="button" onclick="closeModal()" class="px-4 py-2 rounded-xl border border-gray-200 text-gray-600 hover:bg-gray-100 font-medium text-sm">取消</button>
                    <button type="submit" class="px-5 py-2 rounded-xl bg-gradient-to-r from-pink-500 to-rose-500 text-white font-bold shadow-md hover:from-pink-600 hover:to-rose-600 text-sm">保存角色</button>
                </div>
            </form>
        </div>
    </div>

    <div id="logReasonModal" class="fixed inset-0 bg-black/40 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
        <div class="bg-white/95 rounded-3xl max-w-sm w-full p-5 shadow-2xl border border-pink-100">
            <h3 class="text-base font-bold text-gray-800 mb-2 flex items-center gap-1.5">
                <i class="fa-solid fa-pen-to-square text-pink-500"></i>
                变动原因记录
            </h3>
            <p id="logReasonSubtitle" class="text-xs text-gray-500 mb-3"></p>
            <input type="text" id="logReasonInput" placeholder="例如：送了她最爱的波霸奶茶" class="w-full px-3 py-2 text-sm rounded-xl border border-pink-200 focus:outline-none focus:ring-2 focus:ring-pink-400 mb-4">
            <div class="flex justify-end gap-2">
                <button onclick="closeLogReasonModal(false)" class="px-3.5 py-1.5 rounded-lg border border-gray-200 text-gray-600 text-xs font-medium">跳过</button>
                <button onclick="closeLogReasonModal(true)" class="px-4 py-1.5 rounded-lg bg-pink-500 text-white text-xs font-bold hover:bg-pink-600">确认记录</button>
            </div>
        </div>
    </div>

    <div id="historyModal" class="fixed inset-0 bg-black/40 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
        <div class="bg-white/95 rounded-3xl max-w-md w-full p-6 shadow-2xl border border-pink-100 max-h-[80vh] flex flex-col">
            <div class="flex justify-between items-center mb-4 pb-2 border-b border-pink-100">
                <h3 class="text-lg font-bold text-pink-600 flex items-center gap-2">
                    <i class="fa-solid fa-book-bookmark"></i> 后宫起居注 (变动日志)
                </h3>
                <button onclick="toggleLogModal()" class="text-gray-400 hover:text-gray-600 w-7 h-7 rounded-full flex items-center justify-center">
                    <i class="fa-solid fa-xmark"></i>
                </button>
            </div>
            <div id="logList" class="overflow-y-auto space-y-2.5 flex-1 pr-1 text-xs">
                <!-- 动态渲染日志 -->
            </div>
            <div class="mt-4 pt-2 border-t border-gray-100 flex justify-between items-center">
                <button onclick="clearLogs()" class="text-xs text-rose-500 hover:underline">清空记录</button>
                <button onclick="toggleLogModal()" class="px-4 py-1.5 bg-pink-500 text-white rounded-xl text-xs font-bold">关闭</button>
            </div>
        </div>
    </div>

    <div id="randomCardModal" class="fixed inset-0 bg-black/50 backdrop-blur-md z-50 hidden flex items-center justify-center p-4">
        <div class="bg-gradient-to-b from-white to-pink-50 rounded-3xl max-w-sm w-full p-6 shadow-2xl border-2 border-pink-200 text-center relative">
            <button onclick="closeRandomModal()" class="absolute top-4 right-4 text-gray-400 hover:text-gray-600">
                <i class="fa-solid fa-xmark text-lg"></i>
            </button>
            <div class="text-pink-500 text-3xl mb-2">
                <i class="fa-solid fa-dice"></i>
            </div>
            <h3 class="text-xl font-black text-pink-600 mb-1">翻牌得幸</h3>
            <p class="text-xs text-gray-500 mb-4">今天馒头大人要去探望哪位爱妃呢？</p>

            <div id="randomCardContent" class="py-4">
                <div class="w-24 h-24 mx-auto mb-3 rounded-full overflow-hidden border-4 border-pink-300 shadow-md">
                    <img id="randomCharAvatar" src="" class="w-full h-full object-cover">
                </div>
                <h4 id="randomCharName" class="text-lg font-bold text-gray-800"></h4>
                <p id="randomCharTitle" class="text-xs text-pink-500 font-semibold mt-0.5"></p>
                <div class="mt-3 bg-pink-100/60 p-3 rounded-xl text-xs text-pink-800 italic">
                    "<span id="randomCharQuote"></span>"
                </div>
            </div>

            <div class="mt-4 flex gap-2">
                <button onclick="triggerRandomInteration()" class="flex-1 py-2 bg-pink-100 text-pink-600 hover:bg-pink-200 font-bold rounded-xl text-xs transition-colors">
                    <i class="fa-solid fa-rotate"></i> 再翻一次
                </button>
                <button onclick="addFavorFromRandom(5)" class="flex-1 py-2 bg-gradient-to-r from-pink-500 to-rose-500 text-white font-bold rounded-xl text-xs shadow-md hover:from-pink-600">
                    临幸 (+5好感)
                </button>
            </div>
        </div>
    </div>

    <script>
        // 预设头像列表
        const DEFAULT_AVATARS = [
            'https://images.unsplash.com/photo-1534528741775-53994a69daeb?auto=format&fit=crop&w=200&q=80',
            'https://images.unsplash.com/photo-1517841905240-472988babdf9?auto=format&fit=crop&w=200&q=80',
            'https://images.unsplash.com/photo-1524504388940-b1c1722653e1?auto=format&fit=crop&w=200&q=80',
            'https://images.unsplash.com/photo-1494790108377-be9c29b29330?auto=format&fit=crop&w=200&q=80',
            'https://images.unsplash.com/photo-1507003211169-0a1dd7228f2d?auto=format&fit=crop&w=200&q=80'
        ];

        // 默认示范数据
        const INITIAL_CHARACTERS = [
            {
                id: '1',
                name: '夏目樱香',
                avatar: 'https://images.unsplash.com/photo-1534528741775-53994a69daeb?auto=format&fit=crop&w=300&q=80',
                favor: 120,
                color: 'pink',
                tags: ['傲娇', '青梅竹马', '班长'],
                quote: '笨蛋馒头！才、才不是因为担心你才给你带便当的！',
                updatedAt: Date.now() - 1000 * 60 * 30
            },
            {
                id: '2',
                name: '星野琉璃',
                avatar: 'https://images.unsplash.com/photo-1517841905240-472988babdf9?auto=format&fit=crop&w=300&q=80',
                favor: 88,
                color: 'purple',
                tags: ['神秘', '同级生', '占星师'],
                quote: '今天的星象显示，你和我的缘分指数是...100%哦。',
                updatedAt: Date.now() - 1000 * 60 * 60 * 2
            },
            {
                id: '3',
                name: '千叶雅子',
                avatar: 'https://images.unsplash.com/photo-1524504388940-b1c1722653e1?auto=format&fit=crop&w=300&q=80',
                favor: 65,
                color: 'amber',
                tags: ['温柔', '学姐', '学生会'],
                quote: '馒头学弟，今天放学后要不要来茶道部坐一坐呢？',
                updatedAt: Date.now() - 1000 * 60 * 60 * 12
            },
            {
                id: '4',
                name: '白石萌',
                avatar: 'https://images.unsplash.com/photo-1494790108377-be9c29b29330?auto=format&fit=crop&w=300&q=80',
                favor: 35,
                color: 'emerald',
                tags: ['天然呆', '学妹', '游戏社'],
                quote: '前辈！这个关卡好难过，可以手把手教我吗？',
                updatedAt: Date.now() - 1000 * 60 * 60 * 24
            }
        ];

        // 应用状态
        let characters = [];
        let logs = [];
        let pendingChange = null; // 用于暂存变更记录

        // 初始化
        window.addEventListener('DOMContentLoaded', () => {
            loadStorage();
            initPresetAvatars();
            createBgHearts();
            renderApp();
        });

        function loadStorage() {
            const savedChar = localStorage.getItem('mantou_harem_chars');
            const savedLogs = localStorage.getItem('mantou_harem_logs');
            if (savedChar) {
                try { characters = JSON.parse(savedChar); } catch(e) { characters = INITIAL_CHARACTERS; }
            } else {
                characters = INITIAL_CHARACTERS;
            }

            if (savedLogs) {
                try { logs = JSON.parse(savedLogs); } catch(e) { logs = []; }
            }
        }

        function saveStorage() {
            localStorage.setItem('mantou_harem_chars', JSON.stringify(characters));
            localStorage.setItem('mantou_harem_logs', JSON.stringify(logs));
        }

        // 称号判定系统
        function getFavorTitle(favor) {
            if (favor >= 100) return { title: '正宫独宠 / 独占鳌头', rank: '正宫', color: 'bg-rose-500 text-white' };
            if (favor >= 80) return { title: '生死相许 / 挚爱佳人', rank: '贵妃', color: 'bg-pink-500 text-white' };
            if (favor >= 50) return { title: '情深意重 / 甜蜜暧昧', rank: '嫔妃', color: 'bg-purple-500 text-white' };
            if (favor >= 20) return { title: '怦然心动 / 知心朋友', rank: '贵人', color: 'bg-blue-500 text-white' };
            return { title: '萍水相逢 / 颔首之交', rank: '答应', color: 'bg-gray-400 text-white' };
        }

        function renderApp() {
            const searchKeyword = document.getElementById('searchInput').value.trim().toLowerCase();
            const sortBy = document.getElementById('sortBy').value;

            // 过滤
            let filtered = characters.filter(c => 
                c.name.toLowerCase().includes(searchKeyword) || 
                (c.tags && c.tags.some(t => t.toLowerCase().includes(searchKeyword)))
            );

            // 排序
            filtered.sort((a, b) => {
                if (sortBy === 'favor-desc') return b.favor - a.favor || b.updatedAt - a.updatedAt;
                if (sortBy === 'favor-asc') return a.favor - b.favor || b.updatedAt - a.updatedAt;
                if (sortBy === 'name') return a.name.localeCompare(b.name, 'zh-CN');
                if (sortBy === 'updated') return b.updatedAt - a.updatedAt;
                return b.favor - a.favor;
            });

            document.getElementById('totalCountBadge').innerText = `共 ${characters.length} 位`;

            // 1. 渲染正宫看板 (好感度最高者)
            renderEmpressSection();

            // 2. 渲染角色网格卡片
            renderCharacterGrid(filtered);
        }

        function renderEmpressSection() {
            const empressContainer = document.getElementById('empressSection');
            if (characters.length === 0) {
                empressContainer.innerHTML = '';
                return;
            }

            // 找出最高好感度
            const sortedByFavor = [...characters].sort((a, b) => b.favor - a.favor);
            const empress = sortedByFavor[0];

            if (!empress || empress.favor < 10) {
                empressContainer.innerHTML = '';
                return;
            }

            const titleInfo = getFavorTitle(empress.favor);

            empressContainer.innerHTML = `
                <div class="glass-card-gold rounded-3xl p-6 relative overflow-hidden glow-effect transition-all transform hover:-translate-y-1">
                    <div class="absolute -right-8 -bottom-8 opacity-10 text-yellow-600 text-9xl font-black pointer-events-none">
                        👑
                    </div>
                    <div class="flex flex-col md:flex-row items-center gap-6 relative z-10">
                        <div class="relative">
                            <div class="w-28 h-28 md:w-32 md:h-32 rounded-full border-4 border-yellow-400 overflow-hidden shadow-xl relative">
                                <img src="${empress.avatar}" alt="${empress.name}" class="w-full h-full object-cover">
                            </div>
                            <span class="absolute -top-3 -right-2 bg-yellow-400 text-yellow-950 font-black text-xs px-3 py-1 rounded-full shadow-lg border border-white flex items-center gap-1">
                                <i class="fa-solid fa-crown text-amber-700"></i> 正宫娘娘
                            </span>
                        </div>

                        <div class="flex-1 text-center md:text-left">
                            <div class="flex flex-wrap items-center justify-center md:justify-start gap-2 mb-1">
                                <h2 class="text-2xl font-black text-gray-800">${empress.name}</h2>
                                <span class="text-xs px-2.5 py-0.5 rounded-full font-bold ${titleInfo.color}">
                                    ${titleInfo.title}
                                </span>
                            </div>

                            <p class="text-xs text-amber-800 font-medium mb-3 italic">
                                "${empress.quote || '独得馒头大人偏爱，本宫很满意。'}"
                            </p>

                            <!-- 进度条 -->
                            <div class="w-full bg-yellow-200/60 rounded-full h-3.5 p-0.5 mb-2 shadow-inner">
                                <div class="bg-gradient-to-r from-amber-400 to-rose-500 h-2.5 rounded-full transition-all duration-500 relative" style="width: ${Math.min(100, (empress.favor / 150) * 100)}%">
                                </div>
                            </div>

                            <div class="flex items-center justify-between text-xs font-bold text-amber-900">
                                <span>当前好感指数：<strong class="text-base text-rose-600 font-black">${empress.favor}</strong> 心分</span>
                                <span>专宠状态：位居六宫之首</span>
                            </div>
                        </div>

                        <!-- 专宠快捷互动 -->
                        <div class="flex md:flex-col gap-2 justify-center">
                            <button onclick="quickAdjustFavor('${empress.id}', 10, event)" class="bg-gradient-to-r from-yellow-400 to-amber-500 hover:from-yellow-500 hover:to-amber-600 text-white font-bold px-4 py-2 rounded-xl text-xs shadow hover:shadow-md transition-all flex items-center gap-1">
                                <i class="fa-solid fa-heart"></i> 独宠 +10
                            </button>
                        </div>
                    </div>
                </div>
            `;
        }

        function renderCharacterGrid(list) {
            const grid = document.getElementById('characterGrid');

            if (list.length === 0) {
                grid.innerHTML = `
                    <div class="col-span-full text-center py-12 text-gray-400">
                        <i class="fa-solid fa-heart-crack text-4xl mb-2 text-pink-200"></i>
                        <p class="text-sm">后宫暂无匹配的佳丽，快去“纳妃”吧！</p>
                    </div>
                `;
                return;
            }

            // 全局排序以获取排名数字
            const allSorted = [...characters].sort((a, b) => b.favor - a.favor || b.updatedAt - a.updatedAt);

            grid.innerHTML = list.map(char => {
                const rankIndex = allSorted.findIndex(c => c.id === char.id) + 1;
                const titleInfo = getFavorTitle(char.favor);

                // 勋章徽章
                let badgeClass = "bg-gray-100 text-gray-600";
                let badgeIcon = `<span class="font-bold">#${rankIndex}</span>`;
                if (rankIndex === 1) {
                    badgeClass = "bg-gradient-to-r from-yellow-300 to-amber-400 text-yellow-950 font-black shadow";
                    badgeIcon = `<i class="fa-solid fa-crown text-amber-700"></i> 1`;
                } else if (rankIndex === 2) {
                    badgeClass = "bg-gradient-to-r from-slate-200 to-slate-300 text-slate-800 font-black shadow";
                    badgeIcon = `<i class="fa-solid fa-medal text-slate-600"></i> 2`;
                } else if (rankIndex === 3) {
                    badgeClass = "bg-gradient-to-r from-amber-600 to-amber-700 text-white font-black shadow";
                    badgeIcon = `<i class="fa-solid fa-award text-amber-200"></i> 3`;
                }

                // 主题配色样式映射
                const colorThemeMap = {
                    pink: 'border-pink-200/80 hover:border-pink-400',
                    purple: 'border-purple-200/80 hover:border-purple-400',
                    blue: 'border-blue-200/80 hover:border-blue-400',
                    amber: 'border-amber-200/80 hover:border-amber-400',
                    emerald: 'border-emerald-200/80 hover:border-emerald-400'
                };

                const cardBorder = colorThemeMap[char.color] || colorThemeMap.pink;

                return `
                    <div class="glass-card rounded-2xl p-5 border-2 ${cardBorder} transition-all duration-300 hover:shadow-xl hover:-translate-y-1 relative flex flex-col justify-between group">
                        
                        <div>
                            <!-- 顶部栏：排名 & 操作按钮 -->
                            <div class="flex justify-between items-center mb-3">
                                <span class="px-2.5 py-1 rounded-full text-xs flex items-center gap-1 ${badgeClass}">
                                    ${badgeIcon}
                                </span>
                                <div class="flex items-center gap-1 opacity-80 group-hover:opacity-100 transition-opacity">
                                    <button onclick="openEditModal('${char.id}')" class="text-gray-400 hover:text-pink-600 w-7 h-7 rounded-full flex items-center justify-center hover:bg-pink-50 transition-colors" title="编辑信息">
                                        <i class="fa-solid fa-pen text-xs"></i>
                                    </button>
                                    <button onclick="deleteCharacter('${char.id}')" class="text-gray-400 hover:text-rose-600 w-7 h-7 rounded-full flex items-center justify-center hover:bg-rose-50 transition-colors" title="打入冷宫(删除)">
                                        <i class="fa-solid fa-trash text-xs"></i>
                                    </button>
                                </div>
                            </div>

                            <!-- 角色主体信息 -->
                            <div class="flex items-start gap-3.5 mb-3">
                                <img src="${char.avatar}" onerror="this.src='https://placehold.co/100x100/ffe3ec/f83b82?text=Avatar'" class="w-16 h-16 rounded-2xl object-cover border-2 border-white shadow-md flex-shrink-0">
                                <div class="overflow-hidden">
                                    <h3 class="font-bold text-gray-800 text-lg truncate">${char.name}</h3>
                                    <div class="flex items-center gap-1.5 mt-0.5">
                                        <span class="text-[10px] px-2 py-0.5 rounded-md font-bold ${titleInfo.color}">
                                            ${titleInfo.rank} · ${titleInfo.title.split('/')[0]}
                                        </span>
                                    </div>
                                    <!-- 标签 -->
                                    <div class="flex flex-wrap gap-1 mt-1.5">
                                        ${(char.tags || []).map(t => `<span class="text-[10px] bg-white/80 text-pink-600 px-1.5 py-0.5 rounded border border-pink-100">${t}</span>`).join('')}
                                    </div>
                                </div>
                            </div>

                            <!-- 名言口头禅 -->
                            <p class="text-xs text-gray-600 italic bg-white/50 p-2 rounded-xl border border-white/60 mb-3 line-clamp-2">
                                "${char.quote || '暂无口头禅...'}"
                            </p>

                            <!-- 好感度条 -->
                            <div class="mb-4">
                                <div class="flex justify-between items-center text-xs mb-1 font-bold">
                                    <span class="text-pink-600 flex items-center gap-1">
                                        <i class="fa-solid fa-heart text-rose-500 animate-pulse"></i> 好感值
                                    </span>
                                    <span class="text-gray-700 text-sm font-black">${char.favor}</span>
                                </div>
                                <div class="w-full bg-gray-200/70 rounded-full h-2.5 p-0.5">
                                    <div class="bg-gradient-to-r from-pink-400 to-rose-500 h-1.5 rounded-full transition-all duration-300" style="width: ${Math.min(100, (char.favor / 120) * 100)}%"></div>
                                </div>
                            </div>
                        </div>

                        <!-- 快捷变动按钮组 -->
                        <div class="pt-2 border-t border-gray-100/80 flex items-center justify-between gap-1">
                            <div class="flex gap-1">
                                <button onclick="quickAdjustFavor('${char.id}', -5, event)" class="px-2 py-1 bg-gray-100 hover:bg-gray-200 text-gray-600 text-xs font-bold rounded-lg transition-colors">-5</button>
                                <button onclick="quickAdjustFavor('${char.id}', -1, event)" class="px-2 py-1 bg-gray-100 hover:bg-gray-200 text-gray-600 text-xs font-bold rounded-lg transition-colors">-1</button>
                            </div>
                            <div class="flex gap-1">
                                <button onclick="quickAdjustFavor('${char.id}', 1, event)" class="px-2 py-1 bg-pink-100 hover:bg-pink-200 text-pink-600 text-xs font-bold rounded-lg transition-colors">+1</button>
                                <button onclick="quickAdjustFavor('${char.id}', 5, event)" class="px-2 py-1 bg-pink-500 hover:bg-pink-600 text-white text-xs font-bold rounded-lg shadow-sm transition-colors">+5</button>
                                <button onclick="quickAdjustFavor('${char.id}', 10, event)" class="px-2 py-1 bg-gradient-to-r from-pink-500 to-rose-500 hover:from-pink-600 hover:to-rose-600 text-white text-xs font-bold rounded-lg shadow-sm transition-colors">+10</button>
                            </div>
                        </div>

                    </div>
                `;
            }).join('');
        }

        function quickAdjustFavor(id, delta, event) {
            const char = characters.find(c => c.id === id);
            if (!char) return;

            char.favor = Math.max(0, char.favor + delta);
            char.updatedAt = Date.now();

            // 触发飘心特效
            if (event) {
                createHeartPop(event.clientX, event.clientY, delta);
            }

            // 记录潜在日志
            pendingChange = {
                charName: char.name,
                delta: delta,
                time: new Date().toLocaleTimeString('zh-CN', { hour: '2-digit', minute: '2-digit' })
            };

            // 如果增加了比较多的数值，弹出提示记录原因
            if (Math.abs(delta) >= 5) {
                openLogReasonModal(char.name, delta);
            } else {
                addLogRecord(char.name, delta, delta > 0 ? '日常互动增进情感' : '不小心惹她生气了');
                saveStorage();
                renderApp();
            }
        }

        // 飘心特效生成器
        function createHeartPop(x, y, delta) {
            const el = document.createElement('div');
            el.className = 'heart-pop';
            el.style.left = `${x}px`;
            el.style.top = `${y}px`;

            if (delta > 0) {
                el.style.color = '#f83b82';
                el.innerHTML = `❤️ +${delta}`;
            } else {
                el.style.color = '#6b7280';
                el.innerHTML = `💔 ${delta}`;
            }

            document.body.appendChild(el);
            setTimeout(() => el.remove(), 1200);
        }

        function openLogReasonModal(name, delta) {
            const subtitle = document.getElementById('logReasonSubtitle');
            subtitle.innerText = `角色「${name}」好感度 ${delta > 0 ? '+' + delta : delta}，请输入原因：`;
            document.getElementById('logReasonInput').value = '';
            document.getElementById('logReasonModal').classList.remove('hidden');
        }

        function closeLogReasonModal(save) {
            document.getElementById('logReasonModal').classList.add('hidden');
            if (pendingChange) {
                const reason = save ? (document.getElementById('logReasonInput').value.trim() || '特质互通') : '快捷互动';
                addLogRecord(pendingChange.charName, pendingChange.delta, reason);
                saveStorage();
                renderApp();
                pendingChange = null;
            }
        }

        function addLogRecord(name, delta, reason) {
            const logItem = {
                id: Date.now().toString(),
                name,
                delta,
                reason,
                timestamp: new Date().toLocaleString('zh-CN', { month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit' })
            };
            logs.unshift(logItem);
            if (logs.length > 50) logs.pop(); // 保留最近50条
        }

        function toggleLogModal() {
            const modal = document.getElementById('historyModal');
            if (modal.classList.contains('hidden')) {
                renderLogList();
                modal.classList.remove('hidden');
            } else {
                modal.classList.add('hidden');
            }
        }

        function renderLogList() {
            const container = document.getElementById('logList');
            if (logs.length === 0) {
                container.innerHTML = `<p class="text-center text-gray-400 py-6">暂无起居注记录...</p>`;
                return;
            }

            container.innerHTML = logs.map(l => `
                <div class="p-2.5 bg-gray-50 rounded-xl border border-pink-100 flex justify-between items-center">
                    <div>
                        <span class="font-bold text-gray-800">${l.name}</span>
                        <span class="text-gray-500 ml-1">(${l.reason})</span>
                    </div>
                    <div class="flex items-center gap-2">
                        <span class="font-bold ${l.delta > 0 ? 'text-pink-600' : 'text-gray-500'}">
                            ${l.delta > 0 ? '+' + l.delta : l.delta}
                        </span>
                        <span class="text-[10px] text-gray-400">${l.timestamp}</span>
                    </div>
                </div>
            `).join('');
        }

        function clearLogs() {
            if (confirm('确定清空所有后宫起居注记录吗？')) {
                logs = [];
                saveStorage();
                renderLogList();
            }
        }

        function initPresetAvatars() {
            const container = document.getElementById('presetAvatars');
            container.innerHTML = DEFAULT_AVATARS.map((url, i) => `
                <img src="${url}" onclick="selectPresetAvatar('${url}')" class="w-9 h-9 rounded-full object-cover border-2 border-transparent hover:border-pink-500 cursor-pointer flex-shrink-0 transition-all">
            `).join('');
        }

        function selectPresetAvatar(url) {
            document.getElementById('charAvatarUrl').value = url;
            document.getElementById('avatarPreview').src = url;
        }

        function handleFileUpload(e) {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(evt) {
                    document.getElementById('charAvatarUrl').value = evt.target.result;
                    document.getElementById('avatarPreview').src = evt.target.result;
                };
                reader.readAsDataURL(file);
            }
        }

        function openAddModal() {
            document.getElementById('modalTitle').innerHTML = `<i class="fa-solid fa-heart"></i> 纳为佳丽`;
            document.getElementById('characterForm').reset();
            document.getElementById('charId').value = '';
            document.getElementById('avatarPreview').src = DEFAULT_AVATARS[0];
            document.getElementById('charAvatarUrl').value = DEFAULT_AVATARS[0];
            document.getElementById('characterModal').classList.remove('hidden');
        }

        function openEditModal(id) {
            const char = characters.find(c => c.id === id);
            if (!char) return;

            document.getElementById('modalTitle').innerHTML = `<i class="fa-solid fa-pen-to-square"></i> 编辑爱妃信息`;
            document.getElementById('charId').value = char.id;
            document.getElementById('charName').value = char.name;
            document.getElementById('charAvatarUrl').value = char.avatar;
            document.getElementById('avatarPreview').src = char.avatar;
            document.getElementById('charFavor').value = char.favor;
            document.getElementById('charColor').value = char.color || 'pink';
            document.getElementById('charTags').value = (char.tags || []).join(', ');
            document.getElementById('charQuote').value = char.quote || '';

            document.getElementById('characterModal').classList.remove('hidden');
        }

        function closeModal() {
            document.getElementById('characterModal').classList.add('hidden');
        }

        function handleFormSubmit(e) {
            e.preventDefault();
            const id = document.getElementById('charId').value;
            const name = document.getElementById('charName').value.trim();
            const avatar = document.getElementById('charAvatarUrl').value.trim() || DEFAULT_AVATARS[0];
            const favor = parseInt(document.getElementById('charFavor').value) || 0;
            const color = document.getElementById('charColor').value;
            const tags = document.getElementById('charTags').value.split(',').map(t => t.trim()).filter(Boolean);
            const quote = document.getElementById('charQuote').value.trim();

            if (id) {
                // 编辑
                const index = characters.findIndex(c => c.id === id);
                if (index !== -1) {
                    characters[index] = { ...characters[index], name, avatar, favor, color, tags, quote, updatedAt: Date.now() };
                }
            } else {
                // 新增
                const newChar = {
                    id: Date.now().toString(),
                    name,
                    avatar,
                    favor,
                    color,
                    tags,
                    quote,
                    updatedAt: Date.now()
                };
                characters.push(newChar);
                addLogRecord(name, favor, '册封纳入后宫');
            }

            saveStorage();
            closeModal();
            renderApp();
        }

        function deleteCharacter(id) {
            const char = characters.find(c => c.id === id);
            if (!char) return;
            if (confirm(`确定要将「${char.name}」打入冷宫(删除)吗？`)) {
                characters = characters.filter(c => c.id !== id);
                addLogRecord(char.name, 0, '贬入冷宫');
                saveStorage();
                renderApp();
            }
        }

        let currentRandomChar = null;

        function triggerRandomInteration() {
            if (characters.length === 0) {
                alert('后宫暂无佳丽，请先添加角色！');
                return;
            }
            const randomIndex = Math.floor(Math.random() * characters.length);
            currentRandomChar = characters[randomIndex];

            document.getElementById('randomCharAvatar').src = currentRandomChar.avatar;
            document.getElementById('randomCharName').innerText = currentRandomChar.name;
            document.getElementById('randomCharTitle').innerText = getFavorTitle(currentRandomChar.favor).title;
            document.getElementById('randomCharQuote').innerText = currentRandomChar.quote || '今天也想和你多呆一会儿呢...';

            document.getElementById('randomCardModal').classList.remove('hidden');
        }

        function closeRandomModal() {
            document.getElementById('randomCardModal').classList.add('hidden');
        }

        function addFavorFromRandom(val) {
            if (currentRandomChar) {
                quickAdjustFavor(currentRandomChar.id, val, null);
                closeRandomModal();
            }
        }

        function toggleMoreMenu() {
            const menu = document.getElementById('moreMenu');
            menu.classList.toggle('hidden');
        }

        // 点击外部关闭下拉菜单
        document.addEventListener('click', (e) => {
            const container = document.getElementById('moreMenuContainer');
            if (container && !container.contains(e.target)) {
                document.getElementById('moreMenu').classList.add('hidden');
            }
        });

        function exportData() {
            const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify({ characters, logs }));
            const downloadAnchor = document.createElement('a');
            downloadAnchor.setAttribute("href", dataStr);
            downloadAnchor.setAttribute("download", `馒头的后宫_排行榜数据_${new Date().toISOString().slice(0,10)}.json`);
            document.body.appendChild(downloadAnchor);
            downloadAnchor.click();
            downloadAnchor.remove();
        }

        function triggerImport() {
            document.getElementById('importFileInput').click();
        }

        function importData(e) {
            const file = e.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(evt) {
                try {
                    const parsed = JSON.parse(evt.target.result);
                    if (parsed.characters && Array.isArray(parsed.characters)) {
                        characters = parsed.characters;
                        if (parsed.logs) logs = parsed.logs;
                        saveStorage();
                        renderApp();
                        alert('数据导入成功！');
                    } else {
                        alert('JSON 格式不匹配，无法导入！');
                    }
                } catch(err) {
                    alert('文件读取失败，请检查是否为规范的 JSON 文件');
                }
            };
            reader.readAsText(file);
        }

        function resetDefaultData() {
            if (confirm('确定恢复默认示例数据吗？当前新增的角色将被重置！')) {
                characters = INITIAL_CHARACTERS;
                logs = [];
                saveStorage();
                renderApp();
            }
        }

        function createBgHearts() {
            const container = document.getElementById('heartBgContainer');
            const icons = ['❤️', '💖', '🌸', '✨', '💕'];
            for (let i = 0; i < 15; i++) {
                const heart = document.createElement('div');
                heart.className = 'floating-heart-bg';
                heart.style.left = `${Math.random() * 100}vw`;
                heart.style.animationDuration = `${6 + Math.random() * 6}s`;
                heart.style.animationDelay = `${Math.random() * 5}s`;
                heart.style.fontSize = `${14 + Math.random() * 20}px`;
                heart.innerText = icons[Math.floor(Math.random() * icons.length)];
                container.appendChild(heart);
            }
        }
    </script>
</body>
</html>
