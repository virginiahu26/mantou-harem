<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>馒头的后宫 - 恋爱模拟器好感度排行榜</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Mochiyom+Pop+P+One&family=Noto+Sans+SC:wght@400;500;700;900&display=swap" rel="stylesheet">

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        'love-pink': '#ff758c',
                        'love-deep-pink': '#ff4b6e',
                        'love-purple': '#7b2cbf',
                        'love-soft-bg': '#fff0f3',
                        'gold-accent': '#ffb703',
                    },
                    fontFamily: {
                        'title': ['"Mochiyom Pop P One"', '"Noto Sans SC"', 'sans-serif'],
                        'main': ['"Noto Sans SC"', 'sans-serif'],
                    }
                }
            }
        }
    </script>

    <style>
        body {
            font-family: 'Noto Sans SC', sans-serif;
            background: linear-gradient(135deg, #ffe5ec 0%, #ffc2d1 40%, #e0aaff 100%);
            min-height: 100vh;
            background-attachment: fixed;
        }

        /* 浪漫玻璃拟态正方形卡片 */
        .square-card {
            aspect-ratio: 1 / 1;
            background: rgba(255, 255, 255, 0.88);
            backdrop-filter: blur(12px);
            border: 2px solid rgba(255, 182, 193, 0.7);
            box-shadow: 0 10px 25px -5px rgba(255, 117, 140, 0.25);
            transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        .square-card:hover {
            transform: translateY(-6px) scale(1.02);
            box-shadow: 0 18px 30px -5px rgba(255, 75, 110, 0.35);
        }

        /* 前三名黄金/白银/青铜特殊边框 */
        .rank-1-card {
            border: 2px solid #ffd700;
            box-shadow: 0 0 20px rgba(255, 215, 0, 0.5), inset 0 0 12px rgba(255, 215, 0, 0.15);
        }

        .rank-2-card {
            border: 2px solid #c0c0c0;
            box-shadow: 0 0 15px rgba(192, 192, 192, 0.4);
        }

        .rank-3-card {
            border: 2px solid #cd7f32;
            box-shadow: 0 0 15px rgba(205, 127, 50, 0.4);
        }

        /* 飘心与动画效果 */
        @keyframes floatUp {
            0% { transform: translateY(0) scale(0.8) rotate(0deg); opacity: 1; }
            100% { transform: translateY(-90px) scale(1.3) rotate(20deg); opacity: 0; }
        }

        .floating-heart {
            position: fixed;
            pointer-events: none;
            animation: floatUp 1.2s ease-out forwards;
            z-index: 100;
        }

        /* 细微平滑滚动与高质感细节 */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: rgba(255, 229, 236, 0.5); }
        ::-webkit-scrollbar-thumb { background: #ff758c; border-radius: 10px; }
    </style>
</head>
<body class="p-3 md:p-8 text-gray-800 relative overflow-x-hidden">

    <div id="bg-heart-container" class="fixed inset-0 pointer-events-none z-0 overflow-hidden"></div>

    <div class="max-w-6xl mx-auto relative z-10">

        <header class="text-center mb-8">
            <div class="inline-block relative">
                <span class="absolute -top-7 -left-7 text-4xl animate-bounce">👑</span>
                <span class="absolute -bottom-4 -right-7 text-4xl animate-pulse">💖</span>
                <h1 class="text-4xl md:text-6xl font-black text-transparent bg-clip-text bg-gradient-to-r from-love-deep-pink via-purple-600 to-pink-500 font-title tracking-wider drop-shadow-sm py-2">
                    馒头的后宫
                </h1>
            </div>
            <p class="text-pink-700 font-bold mt-2 text-sm md:text-base tracking-wide flex items-center justify-center gap-2">
                <i class="fa-solid fa-heart text-love-deep-pink"></i>
                自定义恋爱模拟器 · 好感度正方形资料卡榜单
                <i class="fa-solid fa-heart text-love-deep-pink"></i>
            </p>
        </header>

        <div class="bg-white/80 backdrop-blur-md rounded-2xl p-4 md:p-5 mb-8 border-2 border-pink-200/80 shadow-lg flex flex-col md:flex-row gap-4 justify-between items-center">
            <!-- 搜索与筛选 -->
            <div class="flex flex-wrap items-center gap-3 w-full md:w-auto">
                <div class="relative flex-1 md:w-60">
                    <i class="fa-solid fa-magnifying-glass absolute left-3 top-1/2 -translate-y-1/2 text-pink-400"></i>
                    <input type="text" id="searchInput" oninput="renderList()" placeholder="搜索名字/性格/名言..." 
                        class="w-full pl-9 pr-4 py-2 rounded-xl border-2 border-pink-200 focus:border-love-pink focus:outline-none bg-white/90 text-sm transition-all">
                </div>
                
                <select id="statusFilter" onchange="renderList()" class="px-3 py-2 rounded-xl border-2 border-pink-200 focus:border-love-pink focus:outline-none bg-white/90 text-sm font-medium text-pink-700">
                    <option value="ALL">全部阶段</option>
                    <option value="初识">初识 (0-29)</option>
                    <option value="暧昧">暧昧 (30-59)</option>
                    <option value="热恋">热恋 (60-89)</option>
                    <option value="誓约">誓约 (90+)</option>
                </select>
            </div>

            <!-- 操作按钮工具栏 -->
            <div class="flex items-center gap-2 w-full md:w-auto justify-end flex-wrap">
                <button onclick="openEditModal()" class="flex-1 md:flex-initial bg-gradient-to-r from-love-pink to-love-deep-pink text-white font-bold px-4 py-2 rounded-xl shadow-md hover:opacity-95 transition active:scale-95 flex items-center justify-center gap-2 text-sm">
                    <i class="fa-solid fa-user-plus"></i> 纳入新欢
                </button>
                <button onclick="exportData()" title="导出备份" class="bg-pink-100 text-pink-600 hover:bg-pink-200 px-3 py-2 rounded-xl text-xs font-bold transition flex items-center gap-1">
                    <i class="fa-solid fa-download"></i> 导出
                </button>
                <button onclick="triggerImport()" title="导入数据" class="bg-pink-100 text-pink-600 hover:bg-pink-200 px-3 py-2 rounded-xl text-xs font-bold transition flex items-center gap-1">
                    <i class="fa-solid fa-upload"></i> 导入
                </button>
                <input type="file" id="importFileInput" accept=".json" class="hidden" onchange="importData(event)">
                <button onclick="resetData()" title="重置数据" class="bg-pink-100 text-pink-500 hover:bg-pink-200 p-2 rounded-xl text-sm transition">
                    <i class="fa-solid fa-rotate-right"></i>
                </button>
            </div>
        </div>

        <div id="characterGrid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6">
            <!-- 卡片由 JavaScript 动态生成 -->
        </div>

        <footer class="text-center mt-12 mb-6 text-xs text-pink-600/80 font-medium">
            <p>💕 独属馒头的甜蜜后宫手册 · 点击正方形卡片可解锁详细生辰档案 💕</p>
        </footer>

    </div>

    <!-- 详细档案 Modal -->
    <div id="detailModal" class="fixed inset-0 bg-black/50 backdrop-blur-md z-50 flex items-center justify-center hidden p-4">
        <div class="bg-white/95 rounded-3xl p-6 md:p-8 max-w-lg w-full max-h-[90vh] overflow-y-auto shadow-2xl relative border-4 border-pink-200 animate-fade-in">
            <button onclick="closeDetailModal()" class="absolute top-4 right-4 text-gray-400 hover:text-pink-500 text-xl w-9 h-9 rounded-full bg-pink-50 flex items-center justify-center border border-pink-200">
                <i class="fa-solid fa-xmark"></i>
            </button>

            <div id="detailContent">
                <!-- 详情卡片由 JS 填充 -->
            </div>
        </div>
    </div>

    <!-- 编辑/新增 Modal -->
    <div id="editModal" class="fixed inset-0 bg-black/50 backdrop-blur-md z-50 flex items-center justify-center hidden p-4">
        <div class="bg-white/95 rounded-3xl p-6 max-w-md w-full max-h-[90vh] overflow-y-auto shadow-2xl relative border-4 border-pink-200">
            <button onclick="closeEditModal()" class="absolute top-4 right-4 text-gray-400 hover:text-pink-500 text-xl w-8 h-8 rounded-full bg-pink-50 flex items-center justify-center">
                <i class="fa-solid fa-xmark"></i>
            </button>

            <h3 id="modalTitle" class="text-2xl font-bold text-pink-600 font-title text-center mb-5">纳入后宫新员</h3>

            <form id="characterForm" onsubmit="saveCharacter(event)" class="space-y-3.5">
                <input type="hidden" id="charId">

                <!-- 头像上传与切换 -->
                <div>
                    <label class="block text-xs font-bold text-pink-700 mb-1">角色头像 (支持本地上传或Emoji)</label>
                    <div class="flex items-center gap-3">
                        <div id="avatarPreview" class="w-14 h-14 rounded-2xl bg-pink-100 border-2 border-pink-300 flex items-center justify-center text-2xl overflow-hidden shadow-inner flex-shrink-0">
                            🌸
                        </div>
                        <div class="flex-1 space-y-1">
                            <label class="cursor-pointer bg-pink-100 hover:bg-pink-200 text-pink-700 text-xs font-bold px-3 py-1.5 rounded-xl border border-pink-300 inline-block text-center transition">
                                <i class="fa-solid fa-cloud-arrow-up mr-1"></i> 上传本地图片
                                <input type="file" id="imageInput" accept="image/*" class="hidden" onchange="handleImageUpload(event)">
                            </label>
                            <input type="text" id="charEmoji" placeholder="或直接填写 Emoji (如 🦊)" 
                                class="w-full px-3 py-1.5 rounded-xl border border-pink-200 focus:border-love-pink focus:outline-none bg-white text-xs"
                                oninput="syncEmojiPreview(this.value)">
                        </div>
                    </div>
                </div>

                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="block text-xs font-bold text-pink-700 mb-1">姓名 *</label>
                        <input type="text" id="charName" required placeholder="如：顾云深" 
                            class="w-full px-3 py-2 rounded-xl border border-pink-200 focus:border-love-pink focus:outline-none bg-white text-sm">
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-pink-700 mb-1">身份/尊号</label>
                        <input type="text" id="charTitle" placeholder="如：正宫 / 傲娇竹马" 
                            class="w-full px-3 py-2 rounded-xl border border-pink-200 focus:border-love-pink focus:outline-none bg-white text-sm">
                    </div>
                </div>

                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="block text-xs font-bold text-pink-700 mb-1">初始好感度 (0-200)</label>
                        <input type="number" id="charAffection" min="0" max="200" value="50" required
                            class="w-full px-3 py-2 rounded-xl border border-pink-200 focus:border-love-pink focus:outline-none bg-white text-sm">
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-pink-700 mb-1">性格标签 (逗号隔开)</label>
                        <input type="text" id="charPersonality" placeholder="腹黑, 黏人, 霸道" 
                            class="w-full px-3 py-2 rounded-xl border border-pink-200 focus:border-love-pink focus:outline-none bg-white text-sm">
                    </div>
                </div>

                <div>
                    <label class="block text-xs font-bold text-pink-700 mb-1">经典名言 / 口头禅</label>
                    <input type="text" id="charQuote" placeholder="例如：“我的眼中只有你。”" 
                        class="w-full px-3 py-2 rounded-xl border border-pink-200 focus:border-love-pink focus:outline-none bg-white text-sm">
                </div>

                <!-- 详细档案字段 -->
                <div class="border-t border-pink-100 pt-2 grid grid-cols-2 gap-3">
                    <div>
                        <label class="block text-xs font-bold text-pink-700 mb-1">身高 / 体重</label>
                        <input type="text" id="charBody" placeholder="185cm / 70kg" 
                            class="w-full px-3 py-1.5 rounded-xl border border-pink-200 focus:border-love-pink focus:outline-none bg-white text-xs">
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-pink-700 mb-1">生日 / 星座</label>
                        <input type="text" id="charBirthday" placeholder="10月15日 / 天秤座" 
                            class="w-full px-3 py-1.5 rounded-xl border border-pink-200 focus:border-love-pink focus:outline-none bg-white text-xs">
                    </div>
                </div>

                <div>
                    <label class="block text-xs font-bold text-pink-700 mb-1">兴趣爱好</label>
                    <input type="text" id="charHobbies" placeholder="烘焙, 调酒, 观察馒头" 
                        class="w-full px-3 py-1.5 rounded-xl border border-pink-200 focus:border-love-pink focus:outline-none bg-white text-xs">
                </div>

                <div>
                    <label class="block text-xs font-bold text-pink-700 mb-1">心动历史 / 专属备注</label>
                    <textarea id="charNotes" rows="2" placeholder="记录下你们之间的告白或高光时刻..." 
                        class="w-full px-3 py-1.5 rounded-xl border border-pink-200 focus:border-love-pink focus:outline-none bg-white text-xs resize-none"></textarea>
                </div>

                <div class="pt-2 flex gap-3">
                    <button type="button" onclick="closeEditModal()" class="w-1/2 py-2 rounded-xl border border-pink-200 text-pink-600 font-bold hover:bg-pink-50 text-sm">
                        取消
                    </button>
                    <button type="submit" class="w-1/2 py-2 rounded-xl bg-gradient-to-r from-love-pink to-love-deep-pink text-white font-bold hover:opacity-90 shadow-md text-sm">
                        保存记录
                    </button>
                </div>
            </form>
        </div>
    </div>

    <script>
        // 初始示例角色库（包含正方形资料卡所需全套数据）
        const defaultCharacters = [
            {
                id: '1',
                name: '陆沉',
                title: '正宫娘娘 · 集团总裁',
                avatar: '👑',
                avatarType: 'emoji', // 'emoji' or 'image'
                affection: 99,
                personality: ['成熟稳重', '控场系', '极致甜宠'],
                quote: '只要你想，整个世界我都可以为你奉上，更何况是我的心。',
                heightWeight: '186 cm / 75 kg',
                birthday: '01月22日 / 水瓶座',
                hobbies: '大提琴、品红酒、为你下厨',
                notes: '初见于雨夜。为你包下了整间咖啡厅，并在你手心扣下了专属戒指。'
            },
            {
                id: '2',
                name: '夏鸣星',
                title: '首席宠妃 · 音乐剧演员',
                avatar: '🐶',
                avatarType: 'emoji',
                affection: 88,
                personality: ['黏人奶狗', '舞台焦点', '阳光治愈'],
                quote: '大小姐，今天的阳光和我，哪个更让你心动呢？',
                heightWeight: '179 cm / 64 kg',
                birthday: '05月26日 / 双子座',
                hobbies: '唱歌、做甜品、陪你逛街',
                notes: '青梅竹马重逢。每次演唱会都会在舞台中央留一个第一排专属视角的座位给你。'
            },
            {
                id: '3',
                name: '萧逸',
                title: '潇洒贵妃 · 职业赛车手',
                avatar: '🐺',
                avatarType: 'emoji',
                affection: 76,
                personality: ['酷帅桀骜', '口嫌体正直', '超强保护欲'],
                quote: '我的副驾驶座，永远只留给你一个人。',
                heightWeight: '185 cm / 72 kg',
                birthday: '11月23日 / 射手座',
                hobbies: '赛车、修摩托、看海',
                notes: '带你跨越终点线后，在全场狂欢中将冠军奖杯直接戴在你的颈间。'
            },
            {
                id: '4',
                name: '齐司礼',
                title: '雅致贵人 · 顶级设计师',
                avatar: '🦊',
                avatarType: 'emoji',
                affection: 58,
                personality: ['毒舌傲娇', '细致体贴', '古风雅致'],
                quote: '笨蛋，连衣服都穿不好……算了，过来我帮你看。',
                heightWeight: '181 cm / 67 kg',
                birthday: '09月01日 / 处女座',
                hobbies: '剪纸、品茶、为你量身定做华服',
                notes: '口头上总是挑剔，却熬夜为你设计了独一无二的甜美晚礼服。'
            }
        ];

        let characters = [];
        let currentUploadedImageData = null; // 临时储存上传的Base64图

        // 初始化
        window.onload = function() {
            loadData();
            renderList();
            initBackgroundHearts();
        };

        // 数据加载与本地存储
        function loadData() {
            const stored = localStorage.getItem('mantou_harem_square_v2');
            if (stored) {
                try {
                    characters = JSON.parse(stored);
                } catch(e) {
                    characters = [...defaultCharacters];
                }
            } else {
                characters = [...defaultCharacters];
            }
        }

        function saveData() {
            localStorage.setItem('mantou_harem_square_v2', JSON.stringify(characters));
        }

        function resetData() {
            if (confirm('确定要重置后宫名单吗？所有自定的角色和本地头像都将还原哦~')) {
                characters = JSON.parse(JSON.stringify(defaultCharacters));
                saveData();
                renderList();
            }
        }

        // 关系阶段计算
        function getRelationStatus(affection) {
            if (affection >= 90) return { label: '誓约', color: 'bg-purple-100 text-purple-700 border-purple-300', icon: '💎' };
            if (affection >= 60) return { label: '热恋', color: 'bg-pink-100 text-pink-700 border-pink-300', icon: '🔥' };
            if (affection >= 30) return { label: '暧昧', color: 'bg-rose-100 text-rose-600 border-rose-200', icon: '🌸' };
            return { label: '初识', color: 'bg-gray-100 text-gray-600 border-gray-200', icon: '🌱' };
        }

        // 渲染正方形卡片列表
        function renderList() {
            const grid = document.getElementById('characterGrid');
            const searchKeyword = document.getElementById('searchInput').value.trim().toLowerCase();
            const statusFilter = document.getElementById('statusFilter').value;

            // 按好感度降序排列
            let sorted = [...characters].sort((a, b) => b.affection - a.affection);

            // 搜索与关系过滤
            let filtered = sorted.filter(char => {
                const searchMatch = char.name.toLowerCase().includes(searchKeyword) || 
                                    (char.quote && char.quote.toLowerCase().includes(searchKeyword)) ||
                                    (char.personality && char.personality.some(p => p.toLowerCase().includes(searchKeyword)));

                const status = getRelationStatus(char.affection).label;
                const statusMatch = statusFilter === 'ALL' || status === statusFilter;

                return searchMatch && statusMatch;
            });

            if (filtered.length === 0) {
                grid.innerHTML = `
                    <div class="col-span-full bg-white/70 backdrop-blur-md rounded-3xl p-12 text-center text-pink-400 border-2 border-dashed border-pink-200">
                        <i class="fa-solid fa-heart-crack text-5xl mb-3 opacity-60"></i>
                        <p class="font-medium text-base">未找到符合要求的后宫成员哦~</p>
                    </div>`;
                return;
            }

            grid.innerHTML = filtered.map((char) => {
                const actualRank = sorted.findIndex(c => c.id === char.id) + 1;
                const status = getRelationStatus(char.affection);
                
                // 特殊冠亚季军排名边框
                let rankBorder = 'square-card';
                if (actualRank === 1) rankBorder += ' rank-1-card';
                else if (actualRank === 2) rankBorder += ' rank-2-card';
                else if (actualRank === 3) rankBorder += ' rank-3-card';

                // 头像元素构建
                let avatarHtml = '';
                if (char.avatarType === 'image' && char.avatar) {
                    avatarHtml = `<img src="${char.avatar}" alt="${escapeHtml(char.name)}" class="w-full h-full object-cover rounded-2xl">`;
                } else {
                    avatarHtml = `<span class="text-3xl">${char.avatar || '❤️'}</span>`;
                }

                // 皇冠/徽章
                let badgeHtml = '';
                if (actualRank === 1) badgeHtml = `<span class="absolute -top-3 -left-2 text-2xl z-20">👑</span>`;
                else if (actualRank === 2) badgeHtml = `<span class="absolute -top-2 -left-1 text-xl z-20">🥈</span>`;
                else if (actualRank === 3) badgeHtml = `<span class="absolute -top-2 -left-1 text-xl z-20">🥉</span>`;

                return `
                    <div class="${rankBorder} rounded-3xl p-4 relative flex flex-col justify-between cursor-pointer group" onclick="openDetailModal('${char.id}')">
                        
                        <!-- 卡片顶部：排名与头像与基本身份 -->
                        <div class="flex items-start gap-3 relative z-10">
                            <!-- 头像框 -->
                            <div class="relative flex-shrink-0">
                                ${badgeHtml}
                                <div class="w-16 h-16 rounded-2xl bg-gradient-to-br from-pink-100 to-pink-200 border-2 border-pink-300 flex items-center justify-center overflow-hidden shadow-inner">
                                    ${avatarHtml}
                                </div>
                            </div>

                            <!-- 姓名与身份 -->
                            <div class="flex-1 min-w-0">
                                <div class="flex items-center justify-between gap-1">
                                    <h3 class="text-lg font-black text-gray-800 truncate">${escapeHtml(char.name)}</h3>
                                    <span class="text-[10px] px-2 py-0.5 rounded-full border ${status.color} font-bold flex-shrink-0">
                                        ${status.label}
                                    </span>
                                </div>
                                <p class="text-xs font-bold text-love-deep-pink truncate mt-0.5">${escapeHtml(char.title || '后宫佳丽')}</p>
                                
                                <!-- 排名数字标号 -->
                                <span class="text-[10px] font-bold text-pink-400/80">NO.${actualRank}</span>
                            </div>
                        </div>

                        <!-- 中间部分：性格标签与经典名言 -->
                        <div class="my-auto space-y-2 relative z-10">
                            <!-- 性格标签 -->
                            <div class="flex flex-wrap gap-1">
                                ${(char.personality || []).slice(0, 3).map(p => `
                                    <span class="text-[10px] bg-pink-50 text-pink-700 px-2 py-0.5 rounded-md border border-pink-200 font-medium">#${escapeHtml(p)}</span>
                                `).join('')}
                            </div>

                            <!-- 经典名言 -->
                            <p class="text-xs text-gray-600 italic font-medium line-clamp-2 bg-white/60 p-2 rounded-xl border border-pink-100/80">
                                “${escapeHtml(char.quote || '与你相遇是最好的幸运。')}”
                            </p>
                        </div>

                        <!-- 底部：好感度条与快速增减 -->
                        <div class="space-y-1.5 relative z-10 pt-1" onclick="event.stopPropagation()">
                            <div class="flex justify-between items-center text-[11px] font-bold">
                                <span class="text-pink-600 flex items-center gap-1">
                                    <i class="fa-solid fa-heart text-love-deep-pink animate-pulse"></i> 好感度
                                </span>
                                <span class="text-love-deep-pink font-black">${char.affection} <span class="text-gray-400 font-normal">/ 100</span></span>
                            </div>

                            <div class="w-full h-2.5 bg-pink-100 rounded-full overflow-hidden border border-pink-200">
                                <div class="h-full bg-gradient-to-r from-pink-400 to-love-deep-pink rounded-full transition-all duration-500" style="width: ${Math.min(100, Math.max(0, char.affection))}%;"></div>
                            </div>

                            <!-- 快速按钮组 (+1, +5, -5) -->
                            <div class="flex items-center justify-between pt-1">
                                <div class="flex items-center gap-1">
                                    <button onclick="adjustAffection('${char.id}', -5, event)" class="px-2 py-0.5 rounded-md bg-pink-100 hover:bg-pink-200 text-pink-700 text-[10px] font-bold transition">
                                        -5
                                    </button>
                                    <button onclick="adjustAffection('${char.id}', 1, event)" class="px-2 py-0.5 rounded-md bg-pink-100 hover:bg-pink-200 text-pink-700 text-[10px] font-bold transition">
                                        +1
                                    </button>
                                    <button onclick="adjustAffection('${char.id}', 5, event)" class="px-2.5 py-0.5 rounded-md bg-gradient-to-r from-love-pink to-love-deep-pink text-white text-[10px] font-bold transition shadow-sm hover:opacity-90">
                                        +5
                                    </button>
                                </div>
                                
                                <span class="text-[10px] text-pink-400 group-hover:text-pink-600 font-bold transition flex items-center gap-0.5">
                                    详情 <i class="fa-solid fa-chevron-right text-[8px]"></i>
                                </span>
                            </div>
                        </div>

                    </div>
                `;
            }).join('');
        }

        // 好感度快捷调算
        function adjustAffection(id, delta, event) {
            const char = characters.find(c => c.id === id);
            if (!char) return;

            char.affection = Math.max(0, char.affection + delta);
            saveData();
            renderList();

            if (delta > 0 && event) {
                createFloatingHeart(event.clientX, event.clientY);
            }
        }

        // 打开详细档案 Modal
        function openDetailModal(id) {
            const char = characters.find(c => c.id === id);
            if (!char) return;

            const container = document.getElementById('detailContent');
            const status = getRelationStatus(char.affection);

            let avatarHtml = char.avatarType === 'image' && char.avatar ? 
                `<img src="${char.avatar}" class="w-full h-full object-cover rounded-3xl">` : 
                `<span class="text-6xl">${char.avatar || '❤️'}</span>`;

            container.innerHTML = `
                <div class="text-center space-y-4">
                    <!-- 头像立绘展示 -->
                    <div class="w-32 h-32 mx-auto rounded-3xl bg-gradient-to-br from-pink-100 to-pink-200 border-4 border-pink-300 flex items-center justify-center overflow-hidden shadow-xl relative">
                        ${avatarHtml}
                    </div>

                    <div>
                        <div class="flex items-center justify-center gap-2">
                            <h2 class="text-2xl font-black text-gray-800">${escapeHtml(char.name)}</h2>
                            <span class="text-xs px-2.5 py-1 rounded-full border ${status.color} font-bold">${status.icon} ${status.label}</span>
                        </div>
                        <p class="text-sm font-bold text-love-deep-pink mt-1">${escapeHtml(char.title || '后宫员')}</p>
                    </div>

                    <!-- 名言高亮框 -->
                    <div class="bg-pink-50/80 p-3.5 rounded-2xl border border-pink-200 text-xs text-pink-800 italic font-medium">
                        “${escapeHtml(char.quote || '与你相识，是我平淡岁月里唯一的奇迹。')}”
                    </div>

                    <!-- 详细身体与生日等资料表格 -->
                    <div class="grid grid-cols-2 gap-3 text-left text-xs">
                        <div class="bg-gray-50 p-3 rounded-2xl border border-gray-100">
                            <span class="text-gray-400 block mb-0.5">📏 身高 / 体重</span>
                            <span class="font-bold text-gray-700">${escapeHtml(char.heightWeight || '保密')}</span>
                        </div>
                        <div class="bg-gray-50 p-3 rounded-2xl border border-gray-100">
                            <span class="text-gray-400 block mb-0.5">🎂 生日 / 星座</span>
                            <span class="font-bold text-gray-700">${escapeHtml(char.birthday || '保密')}</span>
                        </div>
                        <div class="col-span-2 bg-gray-50 p-3 rounded-2xl border border-gray-100">
                            <span class="text-gray-400 block mb-0.5">🎨 兴趣爱好</span>
                            <span class="font-bold text-gray-700">${escapeHtml(char.hobbies || '保密')}</span>
                        </div>
                        <div class="col-span-2 bg-gray-50 p-3 rounded-2xl border border-gray-100">
                            <span class="text-gray-400 block mb-0.5">🏷️ 性格特点</span>
                            <div class="flex flex-wrap gap-1 mt-1">
                                ${(char.personality || []).map(p => `<span class="bg-pink-100 text-pink-700 px-2 py-0.5 rounded-md font-bold text-[10px]">${escapeHtml(p)}</span>`).join('')}
                            </div>
                        </div>
                    </div>

                    <!-- 专属心动备注历史 -->
                    <div class="text-left bg-pink-50/50 p-3.5 rounded-2xl border border-pink-100">
                        <span class="text-xs font-bold text-pink-700 block mb-1">📖 心动备忘录</span>
                        <p class="text-xs text-gray-600 leading-relaxed">${escapeHtml(char.notes || '暂无心动备注记录...')}</p>
                    </div>

                    <!-- 操作按钮组合 -->
                    <div class="pt-3 flex items-center justify-between gap-3">
                        <button onclick="deleteCharacter('${char.id}')" class="text-xs text-red-500 hover:text-red-700 font-bold py-2 px-3">
                            <i class="fa-solid fa-trash-can mr-1"></i> 移出后宫
                        </button>
                        <button onclick="closeDetailModal(); openEditModal('${char.id}')" class="bg-gradient-to-r from-love-pink to-love-deep-pink text-white font-bold text-xs px-5 py-2.5 rounded-xl shadow-md transition hover:opacity-90">
                            <i class="fa-solid fa-pen-to-square mr-1"></i> 修改详细档案
                        </button>
                    </div>
                </div>
            `;

            document.getElementById('detailModal').classList.remove('hidden');
        }

        function closeDetailModal() {
            document.getElementById('detailModal').classList.add('hidden');
        }

        // 打开/关闭 编辑与新增 Modal
        function openEditModal(id = null) {
            const modal = document.getElementById('editModal');
            const form = document.getElementById('characterForm');
            const title = document.getElementById('modalTitle');
            currentUploadedImageData = null;

            if (id) {
                const char = characters.find(c => c.id === id);
                if (!char) return;

                title.innerText = '修改成员档案';
                document.getElementById('charId').value = char.id;
                document.getElementById('charName').value = char.name;
                document.getElementById('charTitle').value = char.title || '';
                document.getElementById('charAffection').value = char.affection;
                document.getElementById('charPersonality').value = (char.personality || []).join(', ');
                document.getElementById('charQuote').value = char.quote || '';
                document.getElementById('charBody').value = char.heightWeight || '';
                document.getElementById('charBirthday').value = char.birthday || '';
                document.getElementById('charHobbies').value = char.hobbies || '';
                document.getElementById('charNotes').value = char.notes || '';

                if (char.avatarType === 'image') {
                    currentUploadedImageData = char.avatar;
                    document.getElementById('avatarPreview').innerHTML = `<img src="${char.avatar}" class="w-full h-full object-cover rounded-2xl">`;
                    document.getElementById('charEmoji').value = '';
                } else {
                    document.getElementById('charEmoji').value = char.avatar || '🌸';
                    document.getElementById('avatarPreview').innerHTML = char.avatar || '🌸';
                }
            } else {
                title.innerText = '纳入后宫新员';
                form.reset();
                document.getElementById('charId').value = '';
                document.getElementById('avatarPreview').innerHTML = '🌸';
                document.getElementById('charEmoji').value = '🌸';
            }

            modal.classList.remove('hidden');
        }

        function closeEditModal() {
            document.getElementById('editModal').classList.add('hidden');
        }

        // 处理本地图片上传 (转Base64)
        function handleImageUpload(e) {
            const file = e.target.files[0];
            if (!file) return;

            if (file.size > 3 * 1024 * 1024) {
                alert('为了保存顺畅，请选择 3MB 以下的图片哦！');
                return;
            }

            const reader = new FileReader();
            reader.onload = function(event) {
                currentUploadedImageData = event.target.result;
                document.getElementById('avatarPreview').innerHTML = `<img src="${currentUploadedImageData}" class="w-full h-full object-cover rounded-2xl">`;
                document.getElementById('charEmoji').value = ''; // 清空 Emoji 框
            };
            reader.readAsDataURL(file);
        }

        // Emoji 预览同步
        function syncEmojiPreview(val) {
            if (val.trim()) {
                currentUploadedImageData = null; // 清除上传图片标记
                document.getElementById('avatarPreview').innerHTML = val.trim();
            }
        }

        // 保存成员
        function saveCharacter(e) {
            e.preventDefault();

            const id = document.getElementById('charId').value;
            const name = document.getElementById('charName').value.trim();
            const title = document.getElementById('charTitle').value.trim();
            const affection = parseInt(document.getElementById('charAffection').value) || 0;
            const personalityRaw = document.getElementById('charPersonality').value;
            const quote = document.getElementById('charQuote').value.trim();
            const heightWeight = document.getElementById('charBody').value.trim();
            const birthday = document.getElementById('charBirthday').value.trim();
            const hobbies = document.getElementById('charHobbies').value.trim();
            const notes = document.getElementById('charNotes').value.trim();

            const personality = personalityRaw ? personalityRaw.split(/[,，]/).map(p => p.trim()).filter(Boolean) : [];

            // 判别头像类型
            let avatarType = 'emoji';
            let avatar = document.getElementById('charEmoji').value.trim() || '🌸';

            if (currentUploadedImageData) {
                avatarType = 'image';
                avatar = currentUploadedImageData;
            }

            if (id) {
                const index = characters.findIndex(c => c.id === id);
                if (index !== -1) {
                    characters[index] = {
                        ...characters[index],
                        name, title, avatar, avatarType, affection, personality, quote, heightWeight, birthday, hobbies, notes
                    };
                }
            } else {
                const newChar = {
                    id: Date.now().toString(),
                    name, title, avatar, avatarType, affection, personality, quote, heightWeight, birthday, hobbies, notes
                };
                characters.push(newChar);
            }

            saveData();
            renderList();
            closeEditModal();
        }

        // 删除成员
        function deleteCharacter(id) {
            const char = characters.find(c => c.id === id);
            if (!char) return;

            if (confirm(`确定要将“${char.name}”移出后宫名单吗？`)) {
                characters = characters.filter(c => c.id !== id);
                saveData();
                closeDetailModal();
                renderList();
            }
        }

        // 数据备份导出 JSON
        function exportData() {
            const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(characters, null, 2));
            const downloadAnchor = document.createElement('a');
            downloadAnchor.setAttribute("href", dataStr);
            downloadAnchor.setAttribute("download", `馒头的后宫_数据备份_${new Date().toISOString().slice(0,10)}.json`);
            document.body.appendChild(downloadAnchor);
            downloadAnchor.click();
            downloadAnchor.remove();
        }

        function triggerImport() {
            document.getElementById('importFileInput').click();
        }

        // 数据导入 JSON
        function importData(e) {
            const file = e.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(event) {
                try {
                    const imported = JSON.parse(event.target.result);
                    if (Array.isArray(imported)) {
                        characters = imported;
                        saveData();
                        renderList();
                        alert('后宫数据导入成功！');
                    } else {
                        alert('导入的文件格式不正确哦！');
                    }
                } catch(err) {
                    alert('读取文件失败，请确保是有效的 JSON 导出文件！');
                }
            };
            reader.readAsText(file);
        }

        // 飘心特效
        function createFloatingHeart(x, y) {
            const heart = document.createElement('div');
            heart.className = 'floating-heart text-love-deep-pink text-2xl';
            heart.innerHTML = ['❤️', '💖', '💗', '💕', '✨'][Math.floor(Math.random() * 5)];
            heart.style.left = `${x - 12}px`;
            heart.style.top = `${y - 20}px`;

            document.body.appendChild(heart);
            setTimeout(() => heart.remove(), 1200);
        }

        // 背景爱心浮动粒子
        function initBackgroundHearts() {
            const container = document.getElementById('bg-heart-container');
            for (let i = 0; i < 15; i++) {
                const heart = document.createElement('div');
                heart.className = 'absolute text-pink-300/35 select-none pointer-events-none';
                heart.innerHTML = '♥';
                heart.style.left = `${Math.random() * 100}%`;
                heart.style.top = `${Math.random() * 100}%`;
                heart.style.fontSize = `${Math.random() * 20 + 12}px`;
                heart.style.animation = `floatUp ${Math.random() * 5 + 5}s linear infinite`;
                heart.style.animationDelay = `${Math.random() * 5}s`;
                container.appendChild(heart);
            }
        }

        // HTML 转义
        function escapeHtml(str) {
            if (!str) return '';
            return str
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#039;");
        }
    </script>
</body>
</html>
